name: Development checks

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/development_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Japanese PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipaexfont
      - name: Set up isolated development environment and run offline checks
        run: python scripts/setup_dev.py
