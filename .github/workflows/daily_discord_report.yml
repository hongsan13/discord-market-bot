name: Daily Discord Market Report

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STARTING_CAPITAL_JPY: "1000000"
        run: python market_discord_bot.py

      - name: Commit report history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/reports.json
          git diff --cached --quiet || git commit -m "Update market report"
          git push
