<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discord Market Bot Dashboard</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e5e7eb}
    main{max-width:1100px;margin:0 auto;padding:24px}
    h1{margin:0 0 8px}.sub{color:#9ca3af;line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
    .card{background:#111827;border:1px solid #374151;border-radius:14px;padding:16px}
    .label{color:#9ca3af;font-size:13px}.value{font-size:26px;font-weight:700;margin-top:8px}
    .pos{color:#22c55e}.neg{color:#ef4444}.muted{color:#9ca3af}
    table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #374151;text-align:left;vertical-align:top}
    th{color:#9ca3af}.pill{display:inline-block;border:1px solid #475569;border-radius:999px;padding:3px 8px;margin:2px}
    textarea{width:100%;min-height:180px;background:#020617;color:#e5e7eb;border:1px solid #374151;border-radius:10px;padding:12px}
    button{background:#2563eb;color:white;border:0;border-radius:10px;padding:10px 14px;margin-top:8px;cursor:pointer}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Discord Market Bot Dashboard</h1>
  <p class="sub">data/reports.json または貼り付けたJSONから、100万円ペーパートレードの履歴を見るページ。</p>

  <div class="grid">
    <div class="card"><div class="label">最新評価額</div><div id="value" class="value">-</div></div>
    <div class="card"><div class="label">累計損益</div><div id="cum" class="value">-</div></div>
    <div class="card"><div class="label">日次損益</div><div id="daily" class="value">-</div></div>
    <div class="card"><div class="label">レポート数</div><div id="count" class="value">-</div></div>
  </div>

  <section class="card">
    <h2>履歴</h2>
    <div id="history">読み込み中...</div>
  </section>

  <section class="card" style="margin-top:14px">
    <h2>JSON手動インポート</h2>
    <p class="sub">Discord投稿内のJSON、またはdata/reports.json全体を貼り付ける。</p>
    <textarea id="jsonInput"></textarea>
    <br><button onclick="manualImport()">表示</button>
  </section>
</main>

<script>
function yen(n){return n==null?'-':'¥'+Math.round(Number(n)).toLocaleString('ja-JP')}
function cls(n){n=Number(n);return n>0?'pos':n<0?'neg':'muted'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalize(data){return Array.isArray(data)?data:[data]}
function render(reports){
  reports = normalize(reports).sort((a,b)=>String(a.report_date).localeCompare(String(b.report_date)))
  const latest = reports[reports.length-1]
  document.getElementById('count').textContent = reports.length
  document.getElementById('value').textContent = latest?yen(latest.portfolio_value_jpy):'-'
  document.getElementById('cum').textContent = latest?yen(latest.cumulative_pnl_jpy):'-'
  document.getElementById('cum').className = 'value ' + (latest?cls(latest.cumulative_pnl_jpy):'')
  document.getElementById('daily').textContent = latest?yen(latest.daily_pnl_jpy):'-'
  document.getElementById('daily').className = 'value ' + (latest?cls(latest.daily_pnl_jpy):'')

  if(!reports.length){document.getElementById('history').textContent='データなし';return}
  document.getElementById('history').innerHTML = `<table><thead><tr>
    <th>日付</th><th>評価額</th><th>日次損益</th><th>累計損益</th><th>翌日方向感</th><th>テーマ</th>
  </tr></thead><tbody>` + reports.map(r=>{
    const themes = Object.entries(r.theme_scores||{}).map(([k,v])=>`${esc(k)} <span class="pill">${esc(v)}</span>`).join('<br>')
    const bias = r.next_day_outlook?.overall_bias || '-'
    return `<tr><td>${esc(r.report_date)}</td><td>${yen(r.portfolio_value_jpy)}</td>
      <td class="${cls(r.daily_pnl_jpy)}">${yen(r.daily_pnl_jpy)}</td>
      <td class="${cls(r.cumulative_pnl_jpy)}">${yen(r.cumulative_pnl_jpy)}</td>
      <td><span class="pill">${esc(bias)}</span></td><td>${themes}</td></tr>`
  }).join('') + '</tbody></table>'
}
function manualImport(){
  try{render(JSON.parse(document.getElementById('jsonInput').value))}
  catch(e){alert('JSON読み込み失敗: '+e.message)}
}
fetch('./data/reports.json').then(r=>r.json()).then(render).catch(()=>{
  document.getElementById('history').textContent='data/reports.jsonを読めない。JSON手動インポートを使う。'
})
</script>
</body>
</html>
