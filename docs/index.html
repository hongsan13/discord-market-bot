<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Discord Market Bot Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      background: #0f172a;
      color: #e5e7eb;
    }
    .card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      border-bottom: 1px solid #374151;
      padding: 8px;
      text-align: left;
    }
    th {
      color: #93c5fd;
    }
    .plus {
      color: #86efac;
    }
    .minus {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <h1>Discord Market Bot Dashboard</h1>

  <div class="card">
    <h2>Latest Report</h2>
    <div id="summary">Loading...</div>
  </div>

  <div class="card">
    <h2>Market Watch</h2>
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Name</th>
          <th>Theme</th>
          <th>Price</th>
          <th>Change</th>
        </tr>
      </thead>
      <tbody id="market"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Paper Portfolio</h2>
    <div id="portfolio"></div>
  </div>

  <script>
    function yen(value) {
      if (value === null || value === undefined) return "-";
      return Math.round(value).toLocaleString("ja-JP") + "円";
    }

    function pct(value) {
      if (value === null || value === undefined) return "-";
      const sign = value >= 0 ? "+" : "";
      return sign + value.toFixed(2) + "%";
    }

    function price(value, currency) {
      if (value === null || value === undefined) return "-";
      if (currency === "JPY") return Math.round(value).toLocaleString("ja-JP") + "円";
      return value.toFixed(2) + "ドル";
    }

    async function main() {
      const response = await fetch("./data/reports.json?ts=" + Date.now());
      const data = await response.json();
      const latest = data.latest;

      if (!latest) {
        document.getElementById("summary").textContent = "No report yet.";
        return;
      }

      document.getElementById("summary").innerHTML =
        `<p>${latest.date} ${latest.time} JST</p>
         <p>USD/JPY: ${latest.usd_jpy.toFixed(2)}</p>
         <p>実売買: ${latest.real_trade ? "あり" : "なし"}</p>`;

      const marketBody = document.getElementById("market");
      marketBody.innerHTML = "";

      latest.market_data.forEach(row => {
        const cls = row.pct_change >= 0 ? "plus" : "minus";
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>${row.ticker}</td>
           <td>${row.name}</td>
           <td>${row.theme}</td>
           <td>${price(row.last, row.currency)}</td>
           <td class="${cls}">${pct(row.pct_change)}</td>`;
        marketBody.appendChild(tr);
      });

      const p = latest.portfolio;
      let html = "";
      html += `<p>総資産: ${yen(p.total_value)}</p>`;
      html += `<p>現金: ${yen(p.cash)}</p>`;
      html += `<p>評価額: ${yen(p.position_value)}</p>`;
      html += `<p>損益: ${yen(p.pnl_jpy)} (${pct(p.pnl_pct)})</p>`;

      if (p.positions.length > 0) {
        html += "<ul>";
        p.positions.forEach(pos => {
          html += `<li>${pos.ticker}: ${pos.qty}株 / 評価 ${yen(pos.market_value_jpy)} / 損益 ${yen(pos.pnl_jpy)} (${pct(pos.pnl_pct)})</li>`;
        });
        html += "</ul>";
      }

      document.getElementById("portfolio").innerHTML = html;
    }

    main().catch(error => {
      document.getElementById("summary").textContent = error.toString();
    });
  </script>
</body>
</html>
